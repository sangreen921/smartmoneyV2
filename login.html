<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Smart Money Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #f0f2f5;
            --bg-panel: #ffffff;
            --primary: #2f54eb;
            --success: #00b42a;
            --danger: #f53f3f;
            --text-main: #1d2129;
            --text-sub: #4e5969;
            --border-color: #e5e6eb;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg-body);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }

        .login-header {
            background: #001529;
            padding: 32px 24px;
            text-align: center;
            color: white;
        }

        .login-header h1 {
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .login-header p {
            font-size: 13px;
            opacity: 0.7;
        }

        .login-body {
            padding: 32px 24px;
        }

        .google-btn {
            width: 100%;
            padding: 12px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
            margin-bottom: 20px;
        }

        .google-btn:hover {
            background: #357ae8;
        }

        .google-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: var(--border-color);
        }

        .divider span {
            background: white;
            padding: 0 12px;
            position: relative;
            color: var(--text-sub);
            font-size: 13px;
        }

        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            background: var(--bg-body);
            border-radius: 4px;
            padding: 3px;
        }

        .tab {
            flex: 1;
            padding: 8px;
            border: none;
            background: transparent;
            color: var(--text-sub);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s;
        }

        .tab.active {
            background: white;
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 13px;
            transition: all 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .submit-btn {
            width: 100%;
            padding: 10px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .error-msg {
            background: #fff1f0;
            border: 1px solid #ffccc7;
            color: var(--danger);
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        .error-msg.show {
            display: block;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .back-link {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
        }

        .back-link a {
            color: var(--primary);
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Smart Money Pro</h1>
            <p>币安智能交易员监控平台</p>
        </div>

        <div class="login-body">
            <button class="google-btn" id="googleLoginBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="white"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="white"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="white"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="white"/>
                </svg>
                使用 Google 账户登录
            </button>

            <div class="divider">
                <span>或使用邮箱</span>
            </div>

            <div class="tabs">
                <button class="tab active" data-tab="login">登录</button>
                <button class="tab" data-tab="register">注册</button>
            </div>

            <div class="error-msg" id="errorMsg"></div>

            <div class="tab-content active" id="loginForm">
                <form id="emailLoginForm">
                    <div class="form-group">
                        <label>邮箱地址</label>
                        <input type="email" name="email" placeholder="your@email.com" required>
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" name="password" placeholder="请输入密码" required>
                    </div>
                    <button type="submit" class="submit-btn">登录</button>
                </form>
            </div>

            <div class="tab-content" id="registerForm">
                <form id="emailRegisterForm">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" name="username" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-group">
                        <label>邮箱地址</label>
                        <input type="email" name="email" placeholder="your@email.com" required>
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" name="password" placeholder="至少6位字符" required minlength="6">
                    </div>
                    <button type="submit" class="submit-btn">注册</button>
                </form>
            </div>

            <div class="back-link">
                <a href="/">← 返回首页（无需登录）</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        // 切换标签
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const target = tab.dataset.tab;
                
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.getElementById(target + 'Form').classList.add('active');
                
                hideError();
            });
        });

        // Google登录
        document.getElementById('googleLoginBtn').addEventListener('click', async () => {
            try {
                const btn = document.getElementById('googleLoginBtn');
                btn.disabled = true;
                btn.textContent = '跳转中...';
                
                const response = await fetch(`${API_BASE}/api/auth/google/url`);
                const data = await response.json();
                
                if (data.success) {
                    window.location.href = data.url;
                } else {
                    showError(data.error || 'Google OAuth未配置');
                    btn.disabled = false;
                    btn.innerHTML = '<svg width="18" height="18">...</svg> 使用 Google 账户登录';
                }
            } catch (error) {
                showError('网络错误，请重试');
                document.getElementById('googleLoginBtn').disabled = false;
            }
        });

        // 邮箱登录
        document.getElementById('emailLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const data = {
                email: formData.get('email'),
                password: formData.get('password')
            };
            
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = '登录中...';
            
            try {
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    localStorage.setItem('token', result.token);
                    localStorage.setItem('user', JSON.stringify(result.user));
                    window.location.href = '/';
                } else {
                    showError(result.error || '登录失败');
                    btn.disabled = false;
                    btn.textContent = '登录';
                }
            } catch (error) {
                showError('网络错误，请重试');
                btn.disabled = false;
                btn.textContent = '登录';
            }
        });

        // 邮箱注册
        document.getElementById('emailRegisterForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const data = {
                username: formData.get('username'),
                email: formData.get('email'),
                password: formData.get('password')
            };
            
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = '注册中...';
            
            try {
                const response = await fetch(`${API_BASE}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    localStorage.setItem('token', result.token);
                    localStorage.setItem('user', JSON.stringify(result.user));
                    window.location.href = '/';
                } else {
                    showError(result.error || '注册失败');
                    btn.disabled = false;
                    btn.textContent = '注册';
                }
            } catch (error) {
                showError('网络错误，请重试');
                btn.disabled = false;
                btn.textContent = '注册';
            }
        });

        function showError(message) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = message;
            errorMsg.classList.add('show');
        }

        function hideError() {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.classList.remove('show');
        }
    </script>
</body>
</html>
